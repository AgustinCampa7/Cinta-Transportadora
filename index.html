<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Cinta Transportadora</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #2b2b40;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h2 { margin-bottom: 20px; }
    .status {
      font-size: 14px;
      margin-bottom: 20px;
      color: #aaa;
    }
    .badge {
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 25px;
      display: block;
    }
    .free { background: #2e7d32; color: #fff; }
    .detected { background: #c62828; color: #fff; animation: pulse 1s infinite alternate; }
    @keyframes pulse {
      from { opacity: 0.7; }
      to { opacity: 1.0; }
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      flex: 1;
      padding: 15px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="card">
    <h2>Cinta Transportadora</h2>
    <div id="netStatus" class="status">Connecting to MQTT Cloud...</div>
    
    <div id="statusBadge" class="badge free">▶ CINTA MOVIÉNDOSE</div>

    <h3>Posición del Servo</h3>
    <div class="btn-group">
      <button onclick="setServo(0)">0°</button>
      <button onclick="setServo(45)">45°</button>
      <button onclick="setServo(135)">135°</button>
    </div>
  </div>

  <script>
    const MQTT_HOST = "f121bb7d.ala.us-east-1.emqxsl.com"; 
    const MQTT_PORT = 8084; // WebSocket TLS
    const MQTT_USER = "cinta_user";
    const MQTT_PASS = "Cinta1234";

    const clientID = "WebCinta_" + Math.random().toString(16).substr(2, 8);
    const client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, clientID);

    client.onConnectionLost = () => { 
      document.getElementById('netStatus').innerText = "🔴 Desconectado"; 
    };
    
    client.onMessageArrived = (msg) => {
      if (msg.destinationName === "cinta/estado") {
        const estado = msg.payloadString;
        const badge = document.getElementById('statusBadge');
        
        if (estado === "DETECTADO") {
          badge.innerText = "⛔ OBJETO DETECTADO";
          badge.className = "badge detected";
        } else {
          badge.innerText = "▶ CINTA MOVIÉNDOSE";
          badge.className = "badge free";
        }
      }
    };

    client.connect({
      onSuccess: () => {
        document.getElementById('netStatus').innerText = "🟢 Conectado a la Nube";
        client.subscribe("cinta/estado");
      },
      onFailure: (e) => { 
        document.getElementById('netStatus').innerText = "🔴 Error: " + e.errorMessage; 
      },
      userName: MQTT_USER,
      password: MQTT_PASS,
      useSSL: true
    });

    function setServo(pos) {
      if (client.isConnected()) {
        const message = new Paho.MQTT.Message(String(pos));
        message.destinationName = "cinta/servo/set";
        client.send(message);
      }
    }
  </script>
</body>
</html>
